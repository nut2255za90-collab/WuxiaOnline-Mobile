
name: Build Wuxia Online Mobile APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'WuxiaOnline_Mobile_OfflineAlpha_v0.4.zip'
      - '.github/workflows/android.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract game project
        run: |
          unzip -q WuxiaOnline_Mobile_OfflineAlpha_v0.4.zip -d project
          echo "PROJECT_DIR=$GITHUB_WORKSPACE/project/WuxiaOnline_Mobile_APK_Project" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle --no-daemon --project-dir "$PROJECT_DIR" assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WuxiaOnline-Mobile-debug-APK
          path: project/WuxiaOnline_Mobile_APK_Project/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
